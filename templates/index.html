<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JungMinder</title>
    
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            margin: 0;
            padding-bottom: 50px;
        }

        /* 헤더 위치와 정렬 원래대로 유지 */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #008000;
            text-align: left;
            font-size: 35px;
            margin: 20px;
        }

        .site-header h1 {
            margin: 20px;
            margin-top: 10px;
            cursor: pointer;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-right: 20px;
        }

        .user-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .logout-btn {
            font-size: 20px;
            padding: 8px 20px;
            border: 2px solid #008000;
            border-radius: 6px;
            cursor: pointer;
            background-color: #008000;
            color: white;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .logout-btn:hover {
            background-color: #006600;
        }

        /* 1. 상단 연두색 박스 */
        .rect {
            margin: 0 auto;
            width: 2000px;
            max-width: 2400px;
            height: 180px;
            background-color: #99FF99;
            border-radius: 20px;
            margin-top: 20px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            padding-left: 60px;
            padding-right: 60px;
            box-sizing: border-box;
            overflow-x: auto;
        }

        /* 동그라미 버튼 */
        .circle-btn {
            width: 130px;
            height: 130px;
            background-color: #7acc7a;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: background-color 0.2s, transform 0.2s;
            flex-shrink: 0;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .circle-btn:hover {
            background-color: #62b362;
            transform: translateY(-3px);
        }

        /* 2. 검색창 영역 */
        .search-container {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 50px;
        }

        .search-box {
            display: flex;
            width: 1700px;
            height: 55px;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 20px;
            border: 2px solid #ccc;
            border-radius: 4px;
            outline: none;
            font-size: 16px;
        }

        .search-box button {
            padding: 10px 50px;
            background-color: #388440;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
        }

        /* 3. 학습 기록 카드들을 아래로 내리기 위한 전체 감싸는 영역 */
        .card-container {
            margin-top: 60px;
        }

        /* 학습 기록 카드 스타일 */
        .restudy-card {
            margin-left: 70px;
            width: calc(100% - 140px);
            max-width: 2400px;
            background-color: #d1f2d1;
            border-radius: 20px;
            margin-bottom: 35px;
            padding: 35px 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
            cursor: pointer;
        }

        .restudy-card:hover {
            opacity: 0.95;
        }

        .log-row {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .log-label {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            min-width: 50px;
        }

        /* 칸을 벗어나지 않고 텍스트만 깔끔하게 ... 처리하는 설정 */
        .log-content-box {
            flex: 1;
            background-color: #ffffff;
            padding: 16px 25px;
            border-radius: 35px;
            font-size: 18px;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hashtag-area {
            margin-left: 75px;
            font-size: 17px;
            color: #2b6130;
            font-weight: 500;
            display: flex;
            gap: 20px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 100px;
            margin-bottom: 30px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .pagination a {
            text-decoration: none;
            color: #333;
            padding: 5px 10px;
            cursor: pointer;
        }

        .pagination a.active {
            color: #008000;
            border-bottom: 2px solid #008000;
        }

        .pagination .arrow {
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- 헤더 영역 (로그인한 사용자 이름 반영 및 로그아웃 버튼 포함) -->
    <header class="site-header">
        <h1 onclick="location.reload()">JungMinder</h1>
        <div class="user-section">
            <span class="user-name">{{ user_name }}</span>
            <button type="button" class="logout-btn" id="logoutButton">로그아웃</button>
        </div>
    </header>

    <!-- 상단 동그라미 버튼 박스 (항상 전체 데이터 유지) -->
    <div class="rect" id="circleContainer">
        <!-- 자바스크립트에 의해 동그라미 버튼들이 생성됩니다 -->
    </div>

    <!-- 검색창 및 새 글쓰기 버튼 -->
    <div class="search-container">
        <div class="search-box">
            <input type="search" id="searchInput" placeholder="검색어를 입력하세요">
            <button type="button" id="searchBtn">검색</button>
            <button type="button" onclick="location.href='/studylog/lookup'" style="background-color: #008000; color: #fff; border: none; border-radius: 4px; padding: 0 30px; font-size: 18px; cursor: pointer; white-space: nowrap;">새 글쓰기</button>
        </div>
    </div>

    <!-- DB 데이터를 받아와 전체 카드가 동적으로 생성될 컨테이너 영역 -->
    <div class="card-container" id="cardContainer">
        <!-- 자바스크립트에 의해 카드가 동적으로 채워집니다 -->
    </div>

    <!-- 페이지네이션 번호 (동적 생성) -->
    <div class="pagination" id="paginationContainer">
        <!-- 자바스크립트에 의해 페이지 번호가 동적으로 생성됩니다 -->
    </div>

    <script>     
        let allLogs = []; // 서버에서 받아온 전체 데이터
        let filteredLogs = []; // 검색어로 필터링된 데이터
        let currentPage = 1; // 현재 페이지 번호
        const itemsPerPage = 2; // 페이지당 보여줄 카드 개수 (2장)

        // HTML 태그와 이미지 태그를 제거하고 순수 텍스트 본문만 추출하는 함수
        function removeTags(html) {
            let tmp = document.createElement("DIV");
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || "";
        }

        // 페이지가 로드되자마자 GET 방식으로 /review/list 데이터를 호출
        $(document).ready(function() {
            $.ajax({
                type: "GET",
                url: "/review/list",
                data: {},
                success: function(response) {
                    if (response.result === "success") {
                        allLogs = response.reveiw_studylogs || [];
                        filteredLogs = allLogs; // 처음에는 전체 데이터로 초기화
                        
                        // 1. 상단 동그라미 버튼은 전체 데이터 기준으로 딱 한 번 고정 생성
                        renderCircles();
                        
                        // 2. 하단 카드 및 페이지네이션 렌더링
                        renderCardsAndPagination();
                    }
                },
                error: function(xhr, status, error) {
                    console.error("데이터를 불러오는 중 오류가 발생했습니다:", error);
                }
            });

            // 검색 버튼 클릭 시 필터링 실행
            $('#searchBtn').on('click', function() {
                filterData();
            });

            // 검색창에 글자가 입력될 때마다 실시간 체크 (백스페이스 등으로 빈칸이 되면 자동 복원)
            $('#searchInput').on('input', function() {
                filterData();
            });

            // 엔터키를 쳤을 때 검색 실행
            $('#searchInput').on('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    filterData();
                }
            });

            // 로그아웃 버튼 이벤트 연동
            $('#logoutButton').on('click', function() {
                $.ajax({
                    type: "POST",
                    url: "/logout",
                    success: function(response) {
                        alert(response["msg"] || "로그아웃되었습니다.");
                        window.location.replace("/");
                    },
                    error: function(xhr, status, error) {
                        console.error("로그아웃 에러:", error);
                        alert("로그아웃 중 오류가 발생했습니다.");
                    }
                });
            });
        });

        // 상단 동그라미 버튼을 그려주는 함수 (항상 전체 항목 유지)
        function renderCircles() {
            let circleContainer = $('#circleContainer');
            circleContainer.empty();

            if (allLogs.length === 0) {
                circleContainer.append('<span style="padding-left: 20px; color: #333; font-size: 18px;">저장된 주제가 없습니다.</span>');
                return;
            }

            for (let i = 0; i < allLogs.length; i++) {
                let log = allLogs[i];
                let circleHtml = `
                    <a href="/studylog/lookup?id=${log._id}" class="circle-btn" title="${log.title}">
                        ${log.title}
                    </a>
                `;
                circleContainer.append(circleHtml);
            }
        }

        // 검색어에 맞춰 데이터 필터링 후 카드 갱신
        function filterData() {
            let keyword = $('#searchInput').val().trim().toLowerCase();

            if (keyword === "") {
                filteredLogs = allLogs; // 검색어가 비어있으면 전체 데이터 복원
            } else {
                // title이나 content에 검색어가 포함된 항목만 추리기
                filteredLogs = allLogs.filter(log => {
                    let title = (log.title || "").toLowerCase();
                    let content = removeTags(log.content || "").toLowerCase();
                    return title.includes(keyword) || content.includes(keyword);
                });
            }

            currentPage = 1; 
            renderCardsAndPagination();
        }

        // 하단 카드와 페이지네이션을 그려주는 함수
        function renderCardsAndPagination() {
            let cardContainer = $('#cardContainer');
            let paginationContainer = $('#paginationContainer');
            
            cardContainer.empty();
            paginationContainer.empty();

            if (filteredLogs.length === 0) {
                cardContainer.append('<div style="text-align: center; font-size: 20px; color: #666; margin-top: 40px;">검색 결과가 없습니다.</div>');
                return;
            }

            // 현재 페이지 기준 2개씩 자르기
            let startIndex = (currentPage - 1) * itemsPerPage;
            let endIndex = startIndex + itemsPerPage;
            let paginatedLogs = filteredLogs.slice(startIndex, endIndex);

            // 하단 카드 생성
            for (let i = 0; i < paginatedLogs.length; i++) {
                let log = paginatedLogs[i];
                let cleanContent = removeTags(log.content);
                
                let cardHtml = `
                    <div class="restudy-card" onclick="location.href='/studylog/lookup?id=${log._id}'">
                        <div class="log-row">
                            <span class="log-label">제목</span>
                            <div class="log-content-box">${log.title}</div>
                        </div>
                        <div class="log-row">
                            <span class="log-label">내용</span>
                            <div class="log-content-box">${cleanContent}</div>
                        </div>
                        <div class="hashtag-area">
                            <span>#학습기록</span>
                            <span>#복습</span>
                        </div>
                    </div>
                `;
                cardContainer.append(cardHtml);
            }

            // 페이지네이션 번호 생성
            let totalPages = Math.ceil(filteredLogs.length / itemsPerPage);
            if (totalPages > 1) {
                let paginationHtml = `<span class="arrow" onclick="changePage(${currentPage - 1})">&lt;</span>`;
                
                for (let i = 1; i <= totalPages; i++) {
                    let activeClass = (i === currentPage) ? 'active' : '';
                    paginationHtml += `<a href="javascript:void(0);" class="${activeClass}" onclick="changePage(${i})">${i}</a>`;
                }
                
                paginationHtml += `<span class="arrow" onclick="changePage(${currentPage + 1})">&gt;</span>`;
                paginationContainer.append(paginationHtml);
            }
        }

        // 페이지 번호 변경 함수
        function changePage(page) {
            let totalPages = Math.ceil(filteredLogs.length / itemsPerPage);
            if (page < 1 || page > totalPages) {
                return;
            }
            currentPage = page;
            renderCardsAndPagination();
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
