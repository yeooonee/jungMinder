<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JungMinder</title>
    
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            margin: 0;
            padding-bottom: 50px;
        }

        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #008000;
            text-align: left;
            font-size: 35px;
            margin: 20px;
        }

        .site-header h1 {
            margin: 20px;
            margin-top: 10px;
            cursor: pointer;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-right: 20px;
        }

        .user-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .logout-btn {
            font-size: 20px;
            padding: 8px 20px;
            border: 2px solid #008000;
            border-radius: 6px;
            cursor: pointer;
            background-color: #008000;
            color: white;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .logout-btn:hover {
            background-color: #006600;
        }

        /* 1. 상단 연두색 박스 (원래 크기) */
        .rect {
            margin: 0 auto;
            width: 2000px;
            max-width: 2400px;
            height: 180px;
            background-color: #99FF99;
            border-radius: 20px;
            margin-top: 20px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            padding-left: 60px;
            padding-right: 60px;
            box-sizing: border-box;
            overflow-x: auto;
        }

        /* 동그라미 버튼 */
        .circle-btn {
            width: 130px;
            height: 130px;
            background-color: #7acc7a;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: background-color 0.2s, transform 0.2s;
            flex-shrink: 0;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .circle-btn:hover {
            background-color: #62b362;
            transform: translateY(-3px);
        }

        /* 2. 검색창 영역 (원래 크기) */
        .search-container {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 50px;
        }

        .search-box {
            display: flex;
            width: 1700px;
            height: 55px;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 20px;
            border: 2px solid #ccc;
            border-radius: 4px;
            outline: none;
            font-size: 16px;
        }

        .search-box button {
            padding: 10px 50px;
            background-color: #388440;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
        }

        /* 3. 학습 기록 카드 영역 (원래 크기) */
        .card-container {
            margin-top: 60px;
        }

        .restudy-card {
            margin-left: 70px;
            width: calc(100% - 140px);
            max-width: 2400px;
            background-color: #d1f2d1;
            border-radius: 20px;
            margin-bottom: 35px;
            padding: 35px 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
            cursor: pointer;
        }

        .restudy-card:hover {
            opacity: 0.95;
        }

        .log-row {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .log-label {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            min-width: 50px;
        }

        .log-content-box {
            flex: 1;
            background-color: #ffffff;
            padding: 16px 25px;
            border-radius: 35px;
            font-size: 18px;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hashtag-area {
            margin-left: 75px;
            font-size: 17px;
            color: #2b6130;
            font-weight: 500;
            display: flex;
            gap: 20px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 100px;
            margin-bottom: 30px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .pagination a {
            text-decoration: none;
            color: #333;
            padding: 5px 10px;
            cursor: pointer;
        }

        .pagination a.active {
            color: #008000;
            border-bottom: 2px solid #008000;
        }

        .pagination .arrow {
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- 헤더 영역 -->
    <header class="site-header">
        <h1 onclick="location.reload()">JungMinder</h1>
        <div class="user-section">
            <span class="user-name">{{ session.get('user_name', '사용자') }}</span>
            <button type="button" class="logout-btn" id="logoutButton">로그아웃</button>
        </div>
    </header>

    <!-- 상단 동그라미 버튼 박스 (복습 대상) -->
    <div class="rect" id="circleContainer">
        <!-- 자바스크립트에 의해 동그라미 버튼들이 생성됩니다 -->
    </div>

    <!-- 검색창 및 새 글쓰기 버튼 -->
    <div class="search-container">
        <div class="search-box">
            <input type="search" id="searchInput" placeholder="검색어를 입력하세요">
            <button type="button" id="searchBtn">검색</button>
            <button type="button" onclick="location.href='/studylogs/create'" style="background-color: #008000; color: #fff; border: none; border-radius: 4px; padding: 0 30px; font-size: 18px; cursor: pointer; white-space: nowrap;">새 글쓰기</button>
        </div>
    </div>

    <!-- 하단 카드 컨테이너 -->
    <div class="card-container" id="cardContainer">
        <!-- 자바스크립트에 의해 카드가 채워집니다 -->
    </div>

    <!-- 페이지네이션 번호 -->
    <div class="pagination" id="paginationContainer">
        <!-- 자바스크립트에 의해 페이지 번호가 채워집니다 -->
    </div>

    <script>    
        let currentPage = 1;
        let currentSearchWord = "";
        const itemsPerPage = 2; // 페이지당 보여줄 카드 개수

        function removeTags(html) {
            let tmp = document.createElement("DIV");
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || "";
        }

        $(document).ready(function() {
            // 1. 상단 동그라미 데이터 로드 (/review/list)
            loadCircles();

            // 2. 하단 카드 데이터 로드 (/studylogs/list)
            loadCards(1, "");

            // 검색 버튼 클릭 시
            $('#searchBtn').on('click', function() {
                currentSearchWord = $('#searchInput').val().trim();
                loadCards(1, currentSearchWord);
            });

            // 검색창 엔터키 입력 시
            $('#searchInput').on('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    currentSearchWord = $('#searchInput').val().trim();
                    loadCards(1, currentSearchWord);
                }
            });

            // 로그아웃 버튼 이벤트
            $('#logoutButton').on('click', function() {
                $.ajax({
                    type: "POST",
                    url: "/logout",
                    success: function(response) {
                        alert(response["msg"] || "로그아웃되었습니다.");
                        window.location.replace("/");
                    },
                    error: function(xhr, status, error) {
                        console.error("로그아웃 에러:", error);
                        alert("로그아웃 중 오류가 발생했습니다.");
                    }
                });
            });
        });

        // 상단 동그라미 데이터 호출 함수 (/review/list)
        function loadCircles() {
            $.ajax({
                type: "GET",
                url: "/review/list",
                success: function(response) {
                    if (response.result === "success") {
                        let reviewLogs = response.reveiw_studylogs || [];
                        renderCircles(reviewLogs);
                    }
                },
                error: function(xhr, status, error) {
                    console.error("복습 대상을 불러오는 중 오류가 발생했습니다:", error);
                }
            });
        }

        // 하단 카드 데이터 호출 함수 (/studylogs/list)
        function loadCards(page, searchword) {
            $.ajax({
                type: "GET",
                url: `/studylogs/list?page=${page}&searchword=${encodeURIComponent(searchword)}`,
                success: function(response) {
                    if (response.result === "success") {
                        currentPage = response.current_page;
                        let logs = response.studylogs || [];
                        let totalCount = response.total_count || 0;

                        renderCardsAndPagination(logs, totalCount, currentPage);
                    }
                },
                error: function(xhr, status, error) {
                    console.error("카드 목록을 불러오는 중 오류가 발생했습니다:", error);
                }
            });
        }

        // 상단 동그라미 렌더링
        function renderCircles(reviewLogs) {
            let circleContainer = $('#circleContainer');
            circleContainer.empty();

            if (reviewLogs.length === 0) {
                circleContainer.append('<span style="padding-left: 20px; color: #333; font-size: 18px;">오늘 복습할 주제가 없습니다.</span>');
                return;
            }

            for (let i = 0; i < reviewLogs.length; i++) {
                let log = reviewLogs[i];
                let circleHtml = `
                    <a href="/studylog/lookup?id=${log._id}" class="circle-btn" title="${log.title}">
                        ${log.title}
                    </a>
                `;
                circleContainer.append(circleHtml);
            }
        }

       
        function renderCardsAndPagination(logs, totalCount, page) {
            let cardContainer = $('#cardContainer');
            let paginationContainer = $('#paginationContainer');
            
            cardContainer.empty();
            paginationContainer.empty();

            if (logs.length === 0) {
                cardContainer.append('<div style="text-align: center; font-size: 20px; color: #666; margin-top: 40px;">검색 결과가 없습니다.</div>');
                return;
            }

            for (let i = 0; i < logs.length; i++) {
                let log = logs[i];
                let cleanContent = removeTags(log.content);
                
                let cardHtml = `
                    <div class="restudy-card" onclick="location.href='/studylog/lookup?id=${log._id}'">
                        <div class="log-row">
                            <span class="log-label">제목</span>
                            <div class="log-content-box">${log.title}</div>
                        </div>
                        <div class="log-row">
                            <span class="log-label">내용</span>
                            <div class="log-content-box">${cleanContent}</div>
                        </div>
                        <div class="hashtag-area">
                            <span>#학습기록</span>
                            <span>#복습</span>
                        </div>
                    </div>
                `;
                cardContainer.append(cardHtml);
            }

            // 페이지네이션 번호 생성
            let totalPages = Math.ceil(totalCount / itemsPerPage);
            
            if (totalPages > 1) {
                let paginationHtml = `<span class="arrow" onclick="changePage(${page - 1})">&lt;</span>`;
                
                for (let i = 1; i <= totalPages; i++) {
                    let activeClass = (i === page) ? 'active' : '';
                    paginationHtml += `<a href="javascript:void(0);" class="${activeClass}" onclick="changePage(${i})">${i}</a>`;
                }
                
                paginationHtml += `<span class="arrow" onclick="changePage(${page + 1})">&gt;</span>`;
                paginationContainer.append(paginationHtml);
            }
        }

        // 페이지 번호 변경 함수
        function changePage(targetPage) {
            if (targetPage < 1) return;
            
            loadCards(targetPage, currentSearchWord);
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
