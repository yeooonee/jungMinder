<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JungMinder</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Toast UI Editor CDN (CSS & JS) -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

    <link rel="stylesheet" href="/static/css/common.css">


    <style>
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #008000;
            text-align: left;
            font-size: 35px;
            margin: 20px;
        }
        .site-header h1 {
            margin: 20px;
            margin-top: 10px;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-right: 20px;
        }

        .user-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .logout-btn {
            font-size: 20px;
            padding: 8px 20px;
            border: 2px solid #008000;
            border-radius: 6px;
            cursor: pointer;
            background-color: #008000;
            color: white;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .logout-btn:hover {
            background-color: #006600;
        }

        #line {
            margin: 20px;
            margin-top: 30px;
        }

        input {
            display: inline-block;
            margin-left: 10px;
            margin-top: 20px;
            width: 1000px;
            height: 100px;
            font-size: 40px;
            border: none;
            outline: none;
        }

        /* 왼쪽 하단 메타 정보 영역 */
        .meta-info {
            float: left;
            margin: 15px 10px;
            font-size: 25px;
            color: #555;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .button-group {
            text-align: right;
            margin: 10px;
            margin-top: 40px;        
        }

        .button-group button {
            font-size: 20px;
            padding: 10px 25px;
            margin-left: 10px;
            border: 2px solid #008000;
            border-radius: 6px;
            cursor: pointer;
            background-color: white;
            color: #008000;
            font-weight: bold;
        }

        #saveButton {
            background-color: #008000;
            color: white;
        }

        /* 에디터 내부의 이미지 최대 너비 지정 */
        .toastui-editor-contents img {
            max-width: 500px; /* 원하는 크기로 수정 */
            width: 100%;       /* 반응형으로 설정할 경우 */
            height: auto;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <h1>JungMinder</h1>
        <div class="user-section">
            <span class="user-name">{{ user_name }}</span>
            <button type="button" class="logout-btn" id="logoutButton">로그아웃</button>
        </div>
    </header>

    <div id="line">
        <input type="text" id="studylog" name="docname" placeholder="제목을 입력하세요." value="{{ studylog.title if studylog else '' }}"/> <!-- *수정버튼을 통해 들어왔을때 기존 내용 자동 반영 -->

        <!--수정시 기존 내용 저장-->
        <textarea id="initialContent" style="display: none;">{{ studylog.content if studylog else '' }}</textarea>

        <!-- 에디터 영역 -->
        <div id="editor" style="margin: 20px;"></div>

        <div class="button-group">
            <button type="button" id="saveButton">저장</button>
            <button type="button" id="cancelButton">취소</button>
        </div>
    </div>

    <script>
        let editor;

        document.addEventListener("DOMContentLoaded", function() {
            // 오늘 날짜 세팅
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            // document.getElementById('regDt').textContent = `${year}-${month}-${day}`;

            // 기존 학습일지 내용 가져오기
            const initialContent = document.getElementById('initialContent').value;
            
            // Toast UI Editor 초기화 (S3 업로드 연동)
            editor = new toastui.Editor({
                el: document.querySelector('#editor'),
                height: '700px',
                initialEditType: 'wysiwyg',
                previewStyle: 'vertical',
                // 수정시 기존 내용 그대로 받아오도록 추가
                initialValue: initialContent,
                hooks: {
                    addImageBlobHook: async (blob, callback) => {
                        console.log("업로드할 이미지 블롭:", blob);

                        const formData = new FormData();
                        formData.append("image", blob);

                        try {
                            const response = await fetch("/file/upload", {
                                method: "POST",
                                body: formData
                            });

                            const result = await response.json();

                            if (response.ok && result.result === "success") {
                                // 백엔드가 완성해서 보내준 전체 S3 이미지 URL을 그대로 사용
                                const imageUrl = result["img_url"]; 
                                const imageName = result["img_name"]
                                callback(imageUrl, imageName);
                            } else {
                                alert("이미지 업로드에 실패했습니다: " + (result.error || "알 수 없는 오류"));
                            }
                        } catch (error) {
                            console.error("이미지 업로드 통신 에러:", error);
                            alert("이미지 업로드 중 오류가 발생했습니다.");
                        }

                        return false;
                    }
                }
            });
        });

        // 저장 버튼 클릭 시
        document.getElementById('saveButton').addEventListener('click', function() {
            let title = document.getElementById('studylog').value;
            let content = editor.getHTML();
            // let regId = document.getElementById('regIdText').innerText;
            // let regDt = document.getElementById('regDt').innerText;
            // let modDt = document.getElementById('modDt').innerText;

            if (!title.trim()) {
                alert("제목을 입력해주세요.");
                return;
            }

            console.log("보내기 직전 제목", title);

            $.ajax({
                type: "POST",
                //수정화면에서 저장했을 때 새 문서 생성하지 않고 기존 문서 수정을 구현하기 위해 추가
                url: "{{ '/studylogs/update/' + studylog._id|string if studylog else '/studylogs/create' }}", 
                data: {
                    title: title,
                    content: content
                },
                success: function (response) {
                    if (response["result"] === "fail") {
                        alert(response["msg"]);
                    } else if (response["result"] === "success") {
                        alert(response["msg"] || "성공적으로 저장되었습니다!");

                        // 최초 저장시 조회 페이지로 이동
                        window.location.replace("/studylogs/view/" + response["id"]);
                    }
                },
                error: function (xhr, status, error) {
                    console.error("에러 발생:", error);
                    alert("서버 통신 중 오류가 발생했습니다.");
                }
            });
        });

        // 취소 버튼 클릭 시
        document.getElementById('cancelButton').addEventListener('click', function() {
            window.history.back();
        });

        // 로그아웃
        document.getElementById('logoutButton').addEventListener('click', function() {
            $.ajax({
                type: "POST",
                url: "/logout",
                success: function(response) {
                    alert(response["msg"])
                    window.location.replace("/");
                }
            })
        })

    </script>
</body>
</html>
