<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>학습일지 조회</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        img { max-width: 384px !important; }
    </style>
</head>
<body>

    <h1>학습일지 조회 테스트</h1>

    <h2>{{ studylog.title }}</h2>

    <p>
        작성자: {{ studylog.reg_id }}
    </p>

    <p>
        등록일: {{ studylog.reg_dt }}
    </p>

    <p>
        수정일: {{ studylog.mod_dt }}
    </p>

    <hr>

    <div>
        {{ studylog.content | safe }}
    </div>

    <br>

    <!--목록으로 버튼-->
    <button type="button" onclick="location.href='/main'">목록으로</button>

    <!--복습 날짜-->
    <div>
        <label for="reviewDate">복습 날짜</label>
        <input type="date" id="reviewDate">
    </div>

    <br>

    <!--복습 난이도 셀렉트-->
    <div>
        <label for="quality">복습 난이도</label>

        <select id="quality">
            <option value="">난이도선택</option>
            <option value="easy">쉬움</option>
            <option value="good">보통</option>
            <option value="hard">어려움</option>
        </select>
    </div>

    <!--학습 완료 버튼-->
    <button type="button" id="reviewCompleteButton">학습완료</button>

    <!--수정 버튼-->
    <a href="/studylogs/create/{{ studylog._id }}"
        <button type="button">수정</button>
    </a>
    <!--삭제 버튼-->
    <button type="button" id="deleteButton">삭제</button>

    <script>
        document.getElementById('deleteButton').addEventListener('click', function() {

            if (!confirm("정말 삭제하시겠습니까?")) {
                return;
            }

            fetch("/studylogs/delete/{{ studylog._id}}", {
                method: "POST"
            })
            .then(response => response.json())
            .then(result => {

                if (result.result === "success") {
                    alert(result.msg);
                    window.location.replace("/");
                } else {
                    alert(result.msg);
                }
            })
            .catch(error => {
                console.error("삭제 중 오류 발생:", error);
                alert("서버 통신 중 오류가 발생했습니다.");
            });            
        });

        document.getElementById('reviewDate').addEventListener('change', function() {

            const reviewDate = this.value;

            console.log("선택한 복습 날짜:", reviewDate);
        });

        document.getElementById('quality').addEventListener('change', function(){

            const quality = this.value;

            console.log("선택한 난이도", quality);
        });

        document.getElementById('reviewCompleteButton').addEventListener('click', function() {

            const reviewDate = document.getElementById('reviewDate').value;
            const quality = document.getElementById('quality').value;

            //복습 날짜 선택 확인
            if (!reviewDate) {
                alert("복습 날짜를 선택해주세요.");
                return;
            }
            //난이도 선택 확인
            if (!quality) {
                alert("복습 난이도를 선택해주세요.")
                return;
            }

        $.ajax({
            type: "POST",
            url: "/review/complete",
            data: {
                studylogId: "{{ studylog._id}}",
                quality: quality,
                reviewDate: reviewDate
            },
            success: function(response) {
                alert(response.msg)
                window.location.replace("/main");
            },
            error: function(xhr, status, error) {
                console.error("복습완료 API 오류:", error);
                alert("서버 통신 중 오류가 발생했습니다.");
            }
        });

            
        });

    </script>

</body>
</html>
