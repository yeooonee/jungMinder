<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습일지 조회</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        img { max-width: 384px !important; }
    </style>
</head>
<body class="bg-white m-0 pb-16">

    
    <header class="flex justify-between items-center text-green-700 text-3xl mx-8 my-6">
        <h1 class="cursor-pointer font-bold text-6xl m-5 mt-2.5" onclick="location.reload()">JungMinder</h1>
        <div class="flex items-center gap-4 mr-5">
            <span class="text-xl font-bold text-gray-800">{{ session.get('user_name', '사용자') }}</span>
            <button type="button" class="text-lg px-5 py-2 border-2 border-green-700 rounded-lg cursor-pointer bg-green-700 text-white font-bold hover:bg-green-800 transition" id="logoutButton">로그아웃</button>
        </div>
    </header>

    <!-- 메인 대형 테두리 박스 (세로로 길쭉하게 상하 패딩과 최소 높이 확장) -->
    <div class="max-w-[2400px] w-[calc(100%-140px)] mx-auto my-8 px-12 py-16 min-h-[1100px] border-2 border-green-600 rounded-2xl bg-white shadow-sm box-border flex flex-col justify-between">
        
        <!-- 상단 영역: 제목 및 메타 정보 -->
        <div class="flex flex-col gap-4">
            <div class="flex items-baseline gap-6">
                <h2 class="text-4xl font-bold text-gray-900 m-0">{{ studylog.title }}</h2>
                <div class="flex gap-4 text-gray-500 text-lg">
                    <span>{{ studylog.reg_id }}</span>
                    <span>{{ studylog.reg_dt }}</span>
                    <span>({{ studylog.mod_dt }})</span>
                </div>
            </div>
            
            <!-- 본문 내용 영역 (세로 공간이 넓게 확보되도록 최소 높이 부여) -->
            <div class="min-h-[450px] text-gray-800 text-lg leading-relaxed pt-8 pb-8 border-t border-gray-100 mt-4">
                {{ studylog.content | safe }}
            </div>
        </div>

        
        <div class="flex flex-wrap items-center justify-between gap-6 pt-8 border-t border-gray-200 mt-auto">
            
            
            <div class="flex flex-wrap items-center gap-4">
                <input type="date" id="reviewDate" class="border border-green-600 rounded-lg px-4 py-2.5 bg-green-200 text-gray-800 text-base outline-none cursor-pointer">
                
                <span class="text-green-700 font-bold text-xl">▲</span>

                <select id="quality" class="border border-green-600 rounded-lg px-4 py-2.5 bg-green-200 text-gray-800 text-base outline-none cursor-pointer">
                    <option value="">난이도 선택</option>
                    <option value="easy">쉬움</option>
                    <option value="good">보통</option>
                    <option value="hard">어려움</option>
                </select>

                <button type="button" id="reviewCompleteButton" class="bg-green-700 text-white font-bold px-6 py-2.5 rounded-lg hover:bg-green-800 transition cursor-pointer text-base">학습완료</button>
            </div>

            <!-- 오른쪽: 수정, 삭제 버튼 -->
            <div class="flex items-center gap-3">
                <a href="/studylogs/create/{{ studylog._id }}" class="no-underline">
                    <button type="button" class="bg-green-500 text-gray-900 font-bold px-6 py-2.5 rounded-lg hover:bg-green-600 transition cursor-pointer text-base">수정</button>
                </a>
                <button type="button" id="deleteButton" class="bg-green-500 text-gray-900 font-bold px-6 py-2.5 rounded-lg hover:bg-green-600 transition cursor-pointer text-base">삭제</button>
            </div>

        </div>

    </div>

    <script>
        document.getElementById('deleteButton').addEventListener('click', function() {

            if (!confirm("정말 삭제하시겠습니까?")) {
                return;
            }

            fetch("/studylogs/delete/{{ studylog._id}}", {
                method: "POST"
            })
            .then(response => response.json())
            .then(result => {

                if (result.result === "success") {
                    alert(result.msg);
                    window.location.replace("/");
                } else {
                    alert(result.msg);
                }
            })
            .catch(error => {
                console.error("삭제 중 오류 발생:", error);
                alert("서버 통신 중 오류가 발생했습니다.");
            });            
        });

        document.getElementById('reviewDate').addEventListener('change', function() {

            const reviewDate = this.value;

            console.log("선택한 복습 날짜:", reviewDate);
        });

        document.getElementById('quality').addEventListener('change', function(){

            const quality = this.value;

            console.log("선택한 난이도", quality);
        });

        document.getElementById('reviewCompleteButton').addEventListener('click', function() {

            const reviewDate = document.getElementById('reviewDate').value;
            const quality = document.getElementById('quality').value;

            //복습 날짜 선택 확인
            if (!reviewDate) {
                alert("복습 날짜를 선택해주세요.");
                return;
            }
            //난이도 선택 확인
            if (!quality) {
                alert("복습 난이도를 선택해주세요.")
                return;
            }

        $.ajax({
            type: "POST",
            url: "/review/complete",
            data: {
                studylogId: "{{ studylog._id}}",
                quality: quality,
                reviewDate: reviewDate
            },
            success: function(response) {

                if (response.result === "success") {
                    alert(response.msg);
                } else {
                    alert(response.msg);
                }
            },
            error: function(xhr, status, error) {
                console.error("복습완료 API 오류:", error);
                alert("서버 통신 중 오류가 발생했습니다.");
            }
        });
            
        });

        // 로그아웃 버튼 연동
        $('#logoutButton').on('click', function() {
            $.ajax({
                type: "POST",
                url: "/logout",
                success: function(response) {
                    alert(response["msg"] || "로그아웃되었습니다.");
                    window.location.replace("/");
                }
            });
        });
    </script>

</body>
</html>
