<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>학습일지 조회</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        img { max-width: 384px !important; }
    </style>
</head>
<body>

    <h1>학습일지 조회 테스트</h1>

    <h2>{{ studylog.title }}</h2>

    <p>
        작성자: {{ studylog.reg_id }}
    </p>

    <p>
        등록일: {{ studylog.reg_dt }}
    </p>

    <p>
        수정일: {{ studylog.mod_dt }}
    </p>

    <hr>

    <div>
        {{ studylog.content | safe }}
    </div>

    <br>

    <!--수정 버튼-->
    <a href="/studylogs/create/{{ studylog._id }}"
        <button type="button">수정</button>
    </a>
    <!--삭제 버튼-->
    <button type="button" id="deleteButton">삭제</button>

    <script>
        document.getElementById('deleteButton').addEventListener('click', function() {

            if (!confirm("정말 삭제하시겠습니까?")) {
                return;
            }

            fetch("/studylogs/delete/{{ studylog._id}}", {
                method: "POST"
            })
            .then(response => response.json())
            .then(result => {

                if (result.result === "success") {
                    alert(result.msg);
                    window.location.replace("/");
                } else {
                    alert(result.msg);
                }
            })
            .catch(error => {
                console.error("삭제 중 오류 발생:", error);
                alert("서버 통신 중 오류가 발생했습니다.");
            });            
        });
    </script>

</body>
</html>
